<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>IMAGGINAI — Zona de Estudo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121316;
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          sans-serif;
        color: #121316;
      }

      #zone-start-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: #121316;
        background-image:
          linear-gradient(to right, rgba(255, 254, 250, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 254, 250, 0.04) 1px, transparent 1px);
        background-size: 40px 40px;
        text-align: left;
        transition: opacity 300ms ease;
      }

      #zone-start-overlay[hidden] {
        display: none;
      }

      .zone-start-card {
        max-width: 28rem;
        width: 100%;
        padding: 2rem;
        border-radius: 16px;
        border: 1px solid #2e323b;
        background: #18191e;
        color: #fffefa;
      }

      .zone-start-tag {
        display: inline-block;
        padding: 0.25rem 0.65rem;
        margin-bottom: 1rem;
        border: 1px solid #ea580c;
        border-radius: 999px;
        font-family: 'Space Grotesk', monospace;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: rgba(234, 88, 12, 0.14);
        color: #fb923c;
      }

      .zone-start-card h1 {
        margin: 0 0 0.75rem;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.65rem;
        font-weight: 700;
        color: #fffefa;
        letter-spacing: -0.02em;
      }

      .zone-start-card p {
        margin: 0 0 1.5rem;
        font-size: 0.95rem;
        line-height: 1.55;
        color: #a1a1aa;
      }

      #zone-start-btn {
        cursor: pointer;
        width: 100%;
        padding: 0.85rem 1.4rem;
        border: 1px solid #ea580c;
        border-radius: 10px;
        background: #ea580c;
        color: #121316;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        transition:
          background-color 150ms ease,
          transform 120ms ease;
      }

      #zone-start-btn:hover,
      #zone-start-btn:focus-visible {
        background: #f97316;
        outline: none;
      }

      #zone-start-btn:active {
        transform: translateY(1px);
      }

      #zone-start-error {
        margin-top: 1rem;
        color: #fb7185;
        font-size: 0.85rem;
        font-weight: 600;
      }

      #zone-debug-badge {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 9;
        padding: 0.4rem 0.75rem;
        border-radius: 8px;
        background: #18181b;
        border: 1px solid #2e323b;
        color: #fffefa;
        font-family: 'Space Grotesk', monospace;
        font-size: 0.78rem;
        font-weight: 600;
        pointer-events: none;
      }
    </style>
    <script type="module" src="/src/zone/main.ts"></script>
  </head>
  <body>
    <div id="zone-start-overlay">
      <div class="zone-start-card">
        <span class="zone-start-tag">Imersão 3D</span>
        <h1 id="zone-start-heading">Pronto para entrar na Zona</h1>
        <p id="zone-start-description">
          Coloque o celular no óculos VR e autorize a câmera para usar os gestos das mãos no seu
          espaço de estudo.
        </p>
        <button id="zone-start-btn" type="button">Iniciar Sessão VR</button>
        <p id="zone-start-error" hidden></p>
      </div>
    </div>

    <div id="zone-debug-badge" hidden></div>

    <a-scene
      id="zone-scene"
      vr-mode-ui="enabled: true"
      webxr="referenceSpaceType: local"
      background="color: #121316"
      renderer="colorManagement: true"
      imx-mode="initialMode: focus; durationMs: 300; cameraSelector: #main-camera; environmentSelector: #zone-environment"
    >
      <a-entity id="zone-environment" imx-environment="preset: focus-dark; opacity: 1"></a-entity>

      <a-entity id="zone-panels"></a-entity>

      <a-entity
        id="zone-belt-menu"
        imx-belt-menu="cameraSelector: #main-camera; zoneId: zone-demo; pomodoroPreset: 25/5"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.2 0">
        <a-entity
          id="main-camera"
          camera
          look-controls
          ixr-passthrough="opacity: 0; maskMode: full; feather: 0.08"
          ixr-hand-tracking="maxHands: 1; delegate: GPU; inputWidth: 480"
          ixr-gesture-detector="source: #main-camera"
          ixr-hand-model="source: #main-camera"
          ixr-cursor="targetClass: .interactable"
          ixr-interactor="targetClass: .interactable; interactPose: pinch"
          imx-debug-overlay="enabled: false; cameraSelector: #main-camera"
        ></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
