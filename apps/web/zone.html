<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMAGGINAI — Zona</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f17;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: #f8fafc;
      }

      #zone-start-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: rgba(11, 15, 23, 0.92);
        text-align: center;
        transition: opacity 300ms ease;
      }

      #zone-start-overlay[hidden] {
        display: none;
      }

      .zone-start-card {
        max-width: 26rem;
        padding: 1.75rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.9);
      }

      .zone-start-card h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
      }

      .zone-start-card p {
        margin: 0 0 1.25rem;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #cbd5e1;
      }

      #zone-start-btn {
        cursor: pointer;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 0.5rem;
        background: #38bdf8;
        color: #0f172a;
        font-size: 1rem;
        font-weight: 600;
      }

      #zone-start-error {
        margin-top: 1rem;
        color: #f87171;
        font-size: 0.875rem;
      }

      #zone-debug-badge {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 9;
        padding: 0.4rem 0.65rem;
        border-radius: 0.375rem;
        background: rgba(6, 9, 14, 0.82);
        border: 1px solid rgba(56, 189, 248, 0.45);
        color: #38bdf8;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        pointer-events: none;
      }
    </style>
    <script type="module" src="/src/zone/main.ts"></script>
  </head>
  <body>
    <div id="zone-start-overlay">
      <div class="zone-start-card">
        <h1 id="zone-start-heading">Zona de Estudo</h1>
        <p id="zone-start-description">
          posicione o celular no óculos vr e permita o acesso à câmera traseira para rastreamento
          das mãos e modo passthrough.
        </p>
        <button id="zone-start-btn" type="button">Entrar na Zona (VR)</button>
        <p id="zone-start-error" hidden></p>
      </div>
    </div>

    <div id="zone-debug-badge" hidden></div>

    <a-scene
      id="zone-scene"
      vr-mode-ui="enabled: true"
      webxr="referenceSpaceType: local"
      background="color: #0B0F17"
      renderer="colorManagement: true"
      imx-mode="initialMode: focus; durationMs: 300; cameraSelector: #main-camera; environmentSelector: #zone-environment"
    >
      <a-entity id="zone-environment" imx-environment="preset: focus-dark; opacity: 1"></a-entity>

      <a-entity id="zone-panels"></a-entity>

      <a-entity id="camera-rig" position="0 1.2 0">
        <a-entity
          id="main-camera"
          camera
          look-controls
          ixr-passthrough="opacity: 0; maskMode: full; feather: 0.08"
          ixr-hand-tracking="maxHands: 1; delegate: GPU; inputWidth: 480"
          ixr-gesture-detector="source: #main-camera"
          ixr-hand-model="source: #main-camera"
          ixr-cursor="targetClass: .interactable"
          ixr-interactor="targetClass: .interactable; interactPose: pinch"
          imx-debug-overlay="enabled: false; cameraSelector: #main-camera"
        ></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
