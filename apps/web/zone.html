<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMAGGINAI — Zona</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070b;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: #0f172a;
      }

      #zone-start-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: radial-gradient(circle at 50% 30%, rgba(9, 13, 20, 0.94), rgba(5, 7, 11, 0.97));
        text-align: center;
        transition: opacity 300ms ease;
      }

      #zone-start-overlay[hidden] {
        display: none;
      }

      .zone-start-card {
        max-width: 27rem;
        padding: 2rem;
        border-radius: 24px;
        border: 2px solid rgba(255, 255, 255, 0.88);
        background: rgba(241, 245, 249, 0.82);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      }

      .zone-start-card h1 {
        margin: 0 0 0.75rem;
        font-size: 1.45rem;
        color: #0f172a;
      }

      .zone-start-card p {
        margin: 0 0 1.35rem;
        font-size: 0.96rem;
        line-height: 1.55;
        color: #1e293b;
      }

      #zone-start-btn {
        cursor: pointer;
        padding: 0.8rem 1.6rem;
        border: 2px solid #ffffff;
        border-radius: 14px;
        background: rgba(226, 232, 240, 0.92);
        color: #0f172a;
        font-size: 1rem;
        font-weight: 700;
        transition:
          box-shadow 150ms ease,
          transform 120ms ease;
      }

      #zone-start-btn:hover,
      #zone-start-btn:focus-visible {
        box-shadow: 0 0 0 3px #ffffff;
        outline: none;
      }

      #zone-start-btn:active {
        transform: scale(0.97);
        box-shadow: 0 0 0 4px #ffffff;
      }

      #zone-start-error {
        margin-top: 1rem;
        color: #b91c1c;
        font-size: 0.875rem;
        font-weight: 600;
      }

      #zone-debug-badge {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        z-index: 9;
        padding: 0.45rem 0.75rem;
        border-radius: 12px;
        background: rgba(241, 245, 249, 0.82);
        backdrop-filter: blur(12px);
        border: 1.5px solid #ffffff;
        color: #0f172a;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        font-weight: 600;
        pointer-events: none;
      }
    </style>
    <script type="module" src="/src/zone/main.ts"></script>
  </head>
  <body>
    <div id="zone-start-overlay">
      <div class="zone-start-card">
        <h1 id="zone-start-heading">Zona de Estudo</h1>
        <p id="zone-start-description">
          posicione o celular no óculos vr e permita o acesso à câmera traseira para rastreamento
          das mãos e modo passthrough.
        </p>
        <button id="zone-start-btn" type="button">Entrar na Zona (VR)</button>
        <p id="zone-start-error" hidden></p>
      </div>
    </div>

    <div id="zone-debug-badge" hidden></div>

    <a-scene
      id="zone-scene"
      vr-mode-ui="enabled: true"
      webxr="referenceSpaceType: local"
      background="color: #05070B"
      renderer="colorManagement: true"
      imx-mode="initialMode: focus; durationMs: 300; cameraSelector: #main-camera; environmentSelector: #zone-environment"
    >
      <a-entity id="zone-environment" imx-environment="preset: focus-dark; opacity: 1"></a-entity>

      <a-entity id="zone-panels"></a-entity>

      <a-entity
        id="zone-belt-menu"
        imx-belt-menu="cameraSelector: #main-camera; zoneId: zone-demo; pomodoroPreset: 25/5"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.2 0">
        <a-entity
          id="main-camera"
          camera
          look-controls
          ixr-passthrough="opacity: 0; maskMode: full; feather: 0.08"
          ixr-hand-tracking="maxHands: 1; delegate: GPU; inputWidth: 480"
          ixr-gesture-detector="source: #main-camera"
          ixr-hand-model="source: #main-camera"
          ixr-cursor="targetClass: .interactable"
          ixr-interactor="targetClass: .interactable; interactPose: pinch"
          imx-debug-overlay="enabled: false; cameraSelector: #main-camera"
        ></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
