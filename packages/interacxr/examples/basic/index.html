<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InteracXR Toolkit - Scenario Test</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="start-screen">
      <h1>InteracXR Toolkit</h1>
      <p>allow camera access to start immersive webxr</p>
      <button id="start-btn" type="button">start experience</button>
      <p id="start-error" hidden></p>
    </div>

    <a-scene xr-mode-ui="enabled:false" background="color:#111" renderer="colorManagement:true">
      <a-entity id="scenario" position="-6 0 0" scale="0.5 0.5 0.5" class="navmesh"></a-entity>

      <a-box class="grabbable" position="-12.5 4.8 -4" color="#FFD700" scale="0.5 0.5 0.5"></a-box>

      <a-cylinder
        class="grabbable"
        position="-11.5 4.1 -4"
        color="#00FF00"
        scale="0.2 0.2 0.2"
      ></a-cylinder>

      <a-torus
        class="grabbable"
        position="-10.5 5.0 -4"
        color="#FF00FF"
        arc="360"
        radius="0.25"
        radius-tubular="0.03"
        rotation="-90 0 0"
      ></a-torus>

      <a-sky color="#87CEEB"></a-sky>
      <a-grid position="0 0.01 0"></a-grid>

      <a-entity id="interaction-hub" position="0 1.5 -1">
        <a-box
          id="door"
          position="-2.3 1 1"
          rotation="0 90 0"
          scale="4 3.5 0.2"
          color="#555"
        ></a-box>
        <a-cylinder
          id="door-button"
          class="interactable"
          position="1.4 1 0.15"
          rotation="0 0 90"
          scale="0.2 0.1 0.2"
          color="red"
        ></a-cylinder>
      </a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera
          id="main-camera"
          position="0 0 0"
          ixr-standard-setup="rig: #camera-rig"
        ></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
